name: CD

# ADR-0009: triggered after CI succeeds on main — never builds, only deploys
# the image that already passed all five security gates in ci.yml.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Update staging image tag
    runs-on: ubuntu-latest
    # Only run when CI passed — skip silently on failure (ci.yml already reports it).
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Reconstruct the same tag that ci.yml's build-push job used.
      # git rev-parse --short HEAD defaults to 7 chars; cut -c1-7 matches that.
      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "TAG=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # ADR-0007: GITHUB_TOKEN cannot bypass the branch ruleset; use a GitHub App.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Update staging image tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          git pull --rebase origin main

          cd deploy/overlays/staging
          kustomize edit set image "items-api=${{ secrets.ECR_REGISTRY }}/devsecops-final:${TAG}"
          cd -

          git add deploy/overlays/staging/kustomization.yaml
          git commit -m "chore: update staging image to ${TAG} [skip ci]"
          git push origin main
