name: CD

# ADR-0009: triggered after CI succeeds on main — never builds, only deploys
# the image that already passed all five security gates in ci.yml.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. sha-e3293bc). Defaults to current deploy/overlays/dev tag."
        required: false

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    # Run when CI passed, or when triggered manually via workflow_dispatch.
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write   # OIDC for AWS (kubectl rollout status — ADR-0014)
      contents: read

    steps:
      # ADR-0007: generate App token BEFORE checkout so actions/checkout
      # configures git with the App's identity — not the default GITHUB_TOKEN.
      # This ensures git push uses the App (which is on the ruleset bypass list).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      # workflow_dispatch: use the explicit input tag if provided, otherwise
      # re-use whatever tag is already in the dev overlay (no-op redeploy).
      # workflow_run: reconstruct the tag from the triggering CI commit SHA.
      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.tag }}" ]; then
              echo "TAG=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            else
              TAG=$(grep 'newTag' deploy/overlays/dev/kustomization.yaml | awk '{print $2}')
              echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
            fi
          else
            SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
            echo "TAG=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update dev image tag
        env:
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cd deploy/overlays/dev
          kustomize edit set image "items-api=${{ secrets.ECR_REGISTRY }}:${TAG}"
          cd -

          git add deploy/overlays/dev/kustomization.yaml
          git commit -m "chore: update dev image to ${TAG} [skip ci]"
          git push origin main

      - name: Configure AWS credentials (OIDC — CD role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CD_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Wire kubectl to EKS
        run: aws eks update-kubeconfig --region us-east-1 --name devsecops-final

      # ADR-0009: poll until Argo CD has synced the exact overlay commit we just
      # pushed — not just any Synced state (which could be the previous commit).
      # 30 × 10 s = 5 min; covers Argo CD's default 3-minute polling interval.
      - name: Wait for Argo CD to sync the new commit
        run: |
          PUSH_SHA=$(git rev-parse HEAD)
          echo "Waiting for Argo CD to sync to ${PUSH_SHA}"
          for i in $(seq 1 30); do
            SYNCED_SHA=$(kubectl get application/items-api-dev -n argocd \
              -o jsonpath='{.status.sync.revision}' 2>/dev/null || echo "")
            STATUS=$(kubectl get application/items-api-dev -n argocd \
              -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "")
            if [ "$SYNCED_SHA" = "$PUSH_SHA" ] && [ "$STATUS" = "Synced" ]; then
              echo "Synced."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timed out (synced=${SYNCED_SHA:-none}, want=${PUSH_SHA})"
              exit 1
            fi
            echo "  attempt ${i}/30: revision=${SYNCED_SHA:-none} status=${STATUS:-unknown}"
            sleep 10
          done

      - name: Wait for dev rollout to be healthy
        run: kubectl rollout status deployment/items-api -n dev --timeout=3m
