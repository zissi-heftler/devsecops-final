name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"   # image tag commits from cd.yml must not re-trigger CI
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC (build-push job)
  contents: read

jobs:
  test:
    name: pytest (80% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
        working-directory: app
      - run: pytest --cov=. --cov-report=term-missing --cov-fail-under=80
        working-directory: app

  bandit:
    name: Bandit SAST (block on HIGH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit==1.8.0
      - run: bandit -r app/ -l -i -x app/tests

  pip-audit:
    name: pip-audit SCA (block on critical CVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.7.3
      - run: pip-audit -r app/requirements.txt

  gitleaks:
    name: Gitleaks (block on any secret)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy container scan (block on critical CVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t devsecops-final:${{ github.sha }} .
      - name: Run Trivy (CRITICAL — fail build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-final:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

  checkov:
    name: Checkov IaC scan (Dockerfile + Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov==3.2.447
      - name: Scan Dockerfile
        run: checkov -f Dockerfile --framework dockerfile --config-file .checkov.yaml
      - name: Scan Terraform
        run: checkov -d infra/ --framework terraform --config-file .checkov.yaml

  build-push:
    name: Build and push to ECR (main only)
    runs-on: ubuntu-latest
    # ADR-0010: runs only after all five security gates pass.
    # ADR-0014: CD role is trusted on refs/heads/main only — this job
    #           never runs on PRs, so a PR-time workflow cannot push images.
    needs: [test, bandit, pip-audit, gitleaks, trivy, checkov]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — CD role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CD_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "TAG=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          IMAGE: ${{ secrets.ECR_REGISTRY }}/devsecops-final:${{ steps.tag.outputs.TAG }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
